name: CloudDesk CI/CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run automated tests
        run: npm test

      - name: Run build checks
        run: npm run build

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

      - name: Package application
        run: |
          tar --exclude='.git' --exclude='node_modules' -czf clouddesk.tar.gz .

      - name: Copy application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          scp -i ~/.ssh/ec2_key clouddesk.tar.gz \
            "$EC2_USER@$EC2_HOST:/tmp/clouddesk.tar.gz"

      - name: Deploy application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key "$EC2_USER@$EC2_HOST" 'bash -s' <<'REMOTE'
            set -e
            sudo mkdir -p /var/www/clouddesk
            sudo tar -xzf /tmp/clouddesk.tar.gz -C /var/www/clouddesk
            sudo chown -R "$USER":"$USER" /var/www/clouddesk
            cd /var/www/clouddesk
            npm ci --omit=dev
            pm2 startOrReload ecosystem.config.cjs --update-env
            pm2 save
            rm -f /tmp/clouddesk.tar.gz
          REMOTE

      - name: Verify live application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          curl --fail --retry 8 --retry-delay 5 \
            "http://$EC2_HOST/api/health"
